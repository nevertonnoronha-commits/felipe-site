  <!-- ic-whatsapp: Lucide "message-circle" (Lucide não tem o logo oficial do WhatsApp; o ícone anterior era uma aproximação em stroke, não a marca oficial, então foi trocado por consistência com o restante do set) -->
  <symbol id="ic-whatsapp" viewBox="0 0 24 24" fill="none">
    <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
